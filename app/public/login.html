<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="/public/styles.css">
</head>

<body>
    <header>
        <h1>DriveIt</h1>
        <p>A platform to buy and sell cars</p>
    </header>
    <nav>
        <ul>
            <li><a href="/">Home</a></li>
            <li><a href="/signup">Sign Up</a></li>

        </ul>
    </nav>
    <div class="container-login">
        <h2>Login</h2>
        <form id="loginForm">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
            <button type="submit">Login</button>
        </form>
        <div id="errorMessage" style="display: none;"></div>
    </div>
    <footer>
        <p>© 2024 DriveIt - All Rights Reserved</p>
    </footer>
    <script>
        document.getElementById("loginForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            const response = await fetch("/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                },
                body: JSON.stringify({ username, password }),
            });

            const responseText = await response.text();

            if (!response.ok) {
                // Show the error message if login fails
                const errorMessageDiv = document.getElementById("errorMessage");
                errorMessageDiv.textContent = responseText;
                errorMessageDiv.style.display = "block";
            }
            else {
                window.location.href = "/"; // Redirect after countdown finishes
            }
        });
    </script>
</body>

</html>

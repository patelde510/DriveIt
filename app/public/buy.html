<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DriveIt - Buy Cars</title>
    <link rel="stylesheet" href="/public/styles.css">
</head>

<body>
    <!-- Header Section -->
    <header>
        <h1>Buy Cars</h1>
        <p>Browse our collection of vehicles available for sale</p>
    </header>

    <!-- Navigation Bar -->
    <nav>
        <ul>
            <li><a href="/">Home</a></li>
            <li><a href="/buy" class="active">Buy Car</a></li>
            <li><a href="/sell">Sell Car</a></li>
            <li><a href="/compare">Compare</a></li>
        </ul>
    </nav>

    <!-- Main Content -->
    <div class="container">
        <section id="vehicle-list">
            <h2>Available Vehicles</h2>

            <div id="search-bar">
                <input type="text" id="search-input" placeholder="Search by make or model..." />
                <div id="search-controls">
                    <select id="type-select">
                        <option value="">All Conditions</option>
                        <!-- Add options dynamically in JavaScript -->
                    </select>
                    <select id="year-select">
                        <option value="">All Years</option>
                        <!-- Add options dynamically in JavaScript -->
                    </select>
                    <button id="search-button">Search</button>
                </div>
            </div>

            <div id="vehicles-container">
                <!-- Vehicle data will be dynamically populated here -->
            </div>
        </section>
    </div>

    <!-- Footer Section -->
    <footer>
        <p>&copy; 2024 DriveIt - All Rights Reserved</p>
    </footer>

    <script>
        async function fetchVehicles() {
            try {
                const searchInput = document.getElementById("search-input").value;
                const year = document.getElementById("year-select").value;
                const condition = document.getElementById("type-select").value;
                
                // Include the filter only if it's selected
                const queryParams = new URLSearchParams({
                    yearofmanufacture: year || "",
                    condition: condition || "",
                    makeOrModel: searchInput || ""
                });

                const response = await fetch(`/get-vehicles?${queryParams.toString()}`);
                if (!response.ok) {
                    throw new Error("Failed to fetch vehicles");
                }

                const vehicles = await response.json();
                const container = document.getElementById("vehicles-container");
                container.innerHTML = ""; // Clear existing content

                if (vehicles.length === 0) {
                    container.innerHTML = "<p>No vehicles available matching your filters.</p>";
                    return;
                }

                // Create vehicle cards dynamically
                vehicles.forEach((vehicle) => {
                    const vehicleCard = document.createElement("div");
                    vehicleCard.classList.add("vehicle-card");
                    vehicleCard.innerHTML = `
                        <h3>${vehicle.make} ${vehicle.model} (${vehicle.yearofmanufacture})</h3>
                        <ul>
                            <li><strong>Price:</strong> $${vehicle.price}</li>
                            <li><strong>Mileage:</strong> ${vehicle.mileage} miles</li>
                            <li><strong>Condition:</strong> ${vehicle.condition}</li>
                            <li><strong>Status:</strong> ${vehicle.status}</li>
                        </ul>
                        <button onclick="addToFavorites('${vehicle.vin}')">Add to Favorites</button>
                    `;
                    container.appendChild(vehicleCard);
                });
            } catch (error) {
                console.error("Error fetching vehicles:", error);
                document.getElementById("vehicles-container").innerHTML = "<p>Failed to load vehicles. Please try again later.</p>";
            }
        }

        async function addToFavorites(vin) {
            try {
                const response = await fetch("/add-to-favorites", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ vin }),
                });

                if (response.ok) {
                    alert("Vehicle added to favorites!");
                    fetchVehicles();
                } else {
                    const errorText = await response.text();
                    alert(`Error adding to favorites: ${errorText}`);
                }
            } catch (err) {
                console.error("Error adding to favorites:", err);
                alert("Error adding to favorites. Please try again.");
            }
        }

        async function fetchFilterOptions() {
            try {
                const response = await fetch("/get-filters");
                if (!response.ok) {
                    throw new Error("Failed to fetch filter options");
                }
                const { years, conditions } = await response.json();

                // Mapping turns json format to list with just list with values needed EX: {condition: 'used', condition: 'new'} ---> ['used, 'new']
                populateDropdown("year-select", years.map(item => item.yearofmanufacture));
                populateDropdown("type-select", conditions.map(item => item.condition.charAt(0).toUpperCase() + item.condition.slice(1).toLowerCase())); // Uppercase first letter
            } catch (error) {
                console.error("Error fetching filter options:", error);
            }
        }

        function populateDropdown(selectId, options) {
            const selectElement = document.getElementById(selectId);
            options.forEach(option => {
                selectElement.innerHTML += `<option value="${option}">${option}</option>`;
            });
        }

        document.addEventListener("DOMContentLoaded", () => {
            fetchVehicles();
            fetchFilterOptions();

            const searchButton = document.getElementById("search-button");
            const searchInput = document.getElementById("search-input");
            const typeSelect = document.getElementById("type-select");
            const yearSelect = document.getElementById("year-select");

            // Search button click handler
            searchButton.addEventListener("click", () => {
                const searchQuery = searchInput.value;
                const filters = {
                    type: typeSelect.value,
                    year: yearSelect.value,
                };
                fetchVehicles(searchQuery, filters);
            });
        });
        
    </script>
</body>

</html>

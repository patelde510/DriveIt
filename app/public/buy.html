<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DriveIt - Buy Cars</title>
    <link rel="stylesheet" href="/public/styles.css">
</head>

<body>
    <!-- Header Section -->
    <header>
        <h1>DriveIt</h1>
    </header>
    
    <!-- Navigation Bar -->
    <nav>
        <ul>
            <li><a href="/">Home</a></li>
            <li><a href="/buy" class="active">Buy Car</a></li>
            <li><a href="/compare">Compare</a></li>
            <li><a href="/review">Review</a></li>
        </ul>
    </nav>

    <!-- Main Content -->
    <div class="container">
        <section id="vehicle-list">
            <h2>Available Vehicles</h2>

            <div id="search-bar">
                <div id="search-controls-1">
                    <input type="text" id="make-input" placeholder="Search by make..." />
                    <input type="text" id="model-input" placeholder="Search by model..." />
                </div>
                <div id="search-controls-2">
                    <input type="text" id="year-input" placeholder="Input year..." />
                    <select id="type-select">
                        <option value="">All Conditions</option>
                        <option value="New">New</option>
                        <option value="used">Used</option>
                    </select>
                    <button id="search-button">Search</button>
                </div>
            </div>

            <div id="vehicles-container">
                <!-- Vehicle data will be dynamically populated here -->
            </div>
        </section>
    </div>

    <!-- Footer Section -->
    <footer>
        <p>&copy; 2024 DriveIt - All Rights Reserved</p>
    </footer>

    <script>
        async function fetchVehicles() {
            try {
                const makeInput = document.getElementById("make-input").value;
                const modelInput = document.getElementById("model-input").value;
                const year = document.getElementById("year-input").value;
                const condition = document.getElementById("type-select").value;
                
                // Include the filter only if it's selected
                const queryParams = new URLSearchParams({
                    make: makeInput || "",
                    model: modelInput || "",
                    yearofmanufacture: year || "",
                    condition: condition || ""
                });

                let response = await fetch(`/get-vehicles?${queryParams.toString()}`);

                if (!response.ok) {
                    throw new Error("Failed to fetch vehicles");
                }

                let vehicles = await response.json();
                const container = document.getElementById("vehicles-container");
                container.innerHTML = ""; // Clear existing content

                // If no vehicles in database that match filters, query the API
                if (vehicles.length == 0) {
                    const fetchApiResponse = await fetch(`/fetch-api-for-buy?${queryParams.toString()}`);
                    response = await fetch(`/get-vehicles?${queryParams.toString()}`);
                    vehicles = await response.json();
                }

                // If nothing again even from API, then display no matches.
                if (vehicles.length === 0) {
                    container.innerHTML = "<p>No vehicles available matching your filters.</p>";
                    return;
                }

                // Create vehicle cards dynamically
                vehicles.forEach((vehicle) => {
                    const vehicleCard = document.createElement("div");
                    vehicleCard.classList.add("vehicle-card");
                    vehicleCard.innerHTML = `
                        <h3>${vehicle.make} ${vehicle.model} (${vehicle.yearofmanufacture})</h3>
                        <ul>
                            <li><strong>Price:</strong> $${vehicle.price}</li>
                            <li><strong>Mileage:</strong> ${vehicle.mileage} miles</li>
                            <li><strong>Condition:</strong> ${vehicle.condition}</li>
                            <li><strong>Status:</strong> ${vehicle.status}</li>
                        </ul>
                        <button onclick="addToFavorites('${vehicle.vin}')">Add to Favorites</button>
                    `;
                    container.appendChild(vehicleCard);
                });
            } catch (error) {
                console.error("Error fetching vehicles:", error);
                document.getElementById("vehicles-container").innerHTML = "<p>Failed to load vehicles. Please try again later.</p>";
            }
        }

        async function addToFavorites(vin) {
            try {
                const response = await fetch("/add-to-favorites", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ vin }),
                });

                if (response.ok) {
                    alert("Vehicle added to favorites!");
                    fetchVehicles();
                } else {
                    const errorText = await response.text();
                    alert(`Error adding to favorites: ${errorText}`);
                }
            } catch (err) {
                console.error("Error adding to favorites:", err);
                alert("Error adding to favorites. Please try again.");
            }
        }

        function populateDropdown(selectId, options) {
            const selectElement = document.getElementById(selectId);
            options.forEach(option => {
                selectElement.innerHTML += `<option value="${option}">${option}</option>`;
            });
        }

        document.addEventListener("DOMContentLoaded", () => {
            fetchVehicles();

            const searchButton = document.getElementById("search-button");
            const makeInput = document.getElementById("make-input");
            const modelInput = document.getElementById("model-input");
            const typeSelect = document.getElementById("type-select");
            const yearInput = document.getElementById("year-input");

            // Search button click handler
            searchButton.addEventListener("click", () => {
                const filters = {
                    make: makeInput.value,
                    model: modelInput.value,
                    type: typeSelect.value,
                    year: yearInput.value,
                };
                fetchVehicles(filters);
            });
        });
        
    </script>
</body>

</html>

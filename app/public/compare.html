<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compare Vehicles</title>
    <link rel="stylesheet" href="/public/styles.css">
</head>

<body>
    <header>
        <h1>DriveIt</h1>
    </header>

    <nav>
        <ul>
            <li><a href="/">Home</a></li>
            <li><a href="/buy">Buy Car</a></li>
            <li><a href="/compare">Compare</a></li>
            <li><a href="/review">Review</a></li>
        </ul>
    </nav>

    <div id="compareTab">
        <div class="form-group">
            <select id="vehicleDropdown1">
                <option value="" disabled selected>Select Car 1</option>
            </select>
            <select id="vehicleDropdown2">
                <option value="" disabled selected>Select Car 2</option>
            </select>
            <select id="vehicleDropdown3">
                <option value="" disabled selected>Select Car 3</option>
            </select>
        </div>

        <div id="comparisonResultsContainer" class="vehicle-info">
            <div id="vehicle1" class="vehicle-details"></div>
            <div id="vehicle2" class="vehicle-details"></div>
            <div id="vehicle3" class="vehicle-details"></div>
        </div>
    </div>

    <footer>
        <p>&copy; 2024 DriveIt - All Rights Reserved</p>
    </footer>

    <script>
        const vehicleDropdown1 = document.getElementById('vehicleDropdown1');
        const vehicleDropdown2 = document.getElementById('vehicleDropdown2');
        const vehicleDropdown3 = document.getElementById('vehicleDropdown3');

        fetch("/get-vehicle-options")
            .then(response => response.json())
            .then(vehicles => {
                vehicles.forEach(vehicle => {
                    const option = document.createElement('option');
                    option.value = vehicle.vin;
                    option.textContent = `${vehicle.make} ${vehicle.model} (${vehicle.yearOfManufacture})`;

                    [vehicleDropdown1, vehicleDropdown2, vehicleDropdown3].forEach(dropdown => {
                        dropdown.appendChild(option.cloneNode(true));
                    });
                });
            })
            .catch(error => console.error("Error fetching vehicles:", error));

        [vehicleDropdown1, vehicleDropdown2, vehicleDropdown3].forEach(dropdown => {
            dropdown.addEventListener('change', updateComparison);
        });

        function updateComparison() {
            const selected1 = vehicleDropdown1.value;
            const selected2 = vehicleDropdown2.value;
            const selected3 = vehicleDropdown3.value;
        
            [vehicleDropdown1, vehicleDropdown2, vehicleDropdown3].forEach(dropdown => {
                dropdown.querySelectorAll('option').forEach(option => {
                    if ([selected1, selected2, selected3].includes(option.value) && option.value !== "") {
                        option.disabled = true;
                    } else {
                        option.disabled = false;
                    }
                });
            });
        
            const vehicleIds = [selected1, selected2, selected3].filter(Boolean);
                
            fetch("/compare", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ vehicles: vehicleIds }),
            })
                .then((response) => response.json())
                .then((data) => {
                    const orderedVehicles = vehicleIds.map(vin =>
                        data.vehicleData.find(vehicle => vehicle.vin === vin)
                    );
                
                    const slots = ["vehicle1", "vehicle2", "vehicle3"];
                    slots.forEach((slot, index) => {
                        const vehicle = orderedVehicles[index];
                        if (vehicle) {
                            displayVehicleData(slot, vehicle);
                        } else {
                            document.getElementById(slot).innerHTML = `<p>No data available</p>`;
                        }
                    });
                })
                .catch((error) => console.error("Error fetching vehicle data:", error));
        }
        
        function displayVehicleData(vehicleId, vehicle) {
            const vehicleDiv = document.getElementById(vehicleId);
            if (!vehicle || !vehicle.make) {
                vehicleDiv.innerHTML = `<p>No data available</p>`;
                return;
            }

            vehicleDiv.innerHTML = `
                <h4>${vehicle.make} ${vehicle.model} (${vehicle.yearOfManufacture})</h4>
                <table>
                    <tr><th>Price</th><td>${vehicle.price}</td></tr>
                    <tr><th>Body Type</th><td>${vehicle.bodyType || "N/A"}</td></tr>
                    <tr><th>Drive Train</th><td>${vehicle.driveTrain || "N/A"}</td></tr>
                    <tr><th>Mileage</th><td>${vehicle.mileage}</td></tr>
                    <tr><th>Condition</th><td>${vehicle.condition}</td></tr>
                    <tr><th>Status</th><td>${vehicle.status}</td></tr>
                    ${vehicle.specs ? `
                    <tr><th>Exterior Color</th><td>${vehicle.specs.exteriorcolor || "N/A"}</td></tr>
                    <tr><th>Interior Color</th><td>${vehicle.specs.interiorcolor || "N/A"}</td></tr>
                    <tr><th>Number of Seats</th><td>${vehicle.specs.numberofseats || "N/A"}</td></tr>
                    <tr><th>Transmission</th><td>${vehicle.specs.transmission || "N/A"}</td></tr>
                    <tr><th>Fuel Type</th><td>${vehicle.specs.fueltype || "N/A"}</td></tr>
                    <tr><th>Engine Type</th><td>${vehicle.specs.enginetype || "N/A"}</td></tr>
                    ` : `
                    <tr><td colspan="2">No specs available</td></tr>
                    `}
                </table>
            `;
        }
    </script>
</body>

</html>

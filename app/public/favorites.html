<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favorites</title>
    <link rel="stylesheet" href="/public/styles.css">
</head>

<body>
    <!-- Header Section -->
    <header>
        <h1>DriveIt</h1>
    </header>

    <nav>
        <ul>
            <li><a href="/">Home</a></li>
            <li><a href="/buy">Buy Car</a></li>
            <li><a href="/compare">Compare</a></li>
            <li><a href="/review">Review</a></li>
        </ul>
    </nav>

    <div class="container">
        <section id="favorites-list">
            <h2>Favorited Vehicles</h2>
            <div id="favorites-container" class="vehicles-container"></div>
        </section>
    </div>

    <!-- Modal Structure -->
    <div id="vehicle-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2 id="modal-title"></h2>
            <img id="modal-image" src="" alt="Car Image" />
            <ul id="modal-specs"></ul>
        </div>
    </div>

    <footer>
        <p>&copy; 2024 DriveIt - All Rights Reserved</p>
    </footer>

    <script>
        // Fetch favorited vehicles and populate the page
        async function fetchFavorites() {
            try {
                const response = await fetch("/get-favorites");
                if (!response.ok) {
                    throw new Error("Failed to fetch favorites");
                }

                const favorites = await response.json();
                const container = document.getElementById("favorites-container");

                if (favorites.length === 0) {
                    container.innerHTML = "<p>You have no favorite vehicles.</p>";
                    return;
                }

                container.innerHTML = "";
                favorites.forEach((vehicle) => createVehicleCard(vehicle, container));
            } catch (error) {
                console.error("Error fetching favorites:", error);
                document.getElementById("favorites-container").innerHTML = "<p>Failed to load favorites. Please try again later.</p>";
            }
        }

        // Create a vehicle card and add it to the container
        function createVehicleCard(vehicle, container) {
            const vehicleCard = document.createElement("div");
            vehicleCard.classList.add("vehicle-card");
            vehicleCard.innerHTML = `
                <img src="${vehicle.image_url || '/public/images/placeholder.jpeg'}" alt="${vehicle.make} ${vehicle.model}" class="vehicle-image"/>
                <h3>${vehicle.make} ${vehicle.model} (${vehicle.yearofmanufacture})</h3>
                <ul>
                    <li><strong>Price:</strong> $${vehicle.price}</li>
                    <li><strong>Mileage:</strong> ${vehicle.mileage || 'N/A'} miles</li>
                    <li><strong>Condition:</strong> ${vehicle.condition || 'N/A'}</li>
                    <li><strong>Status:</strong> ${vehicle.status || 'N/A'}</li>
                </ul>
                <button class="remove-button" onclick="event.stopPropagation(); removeFromFavorites('${vehicle.vin}')">Remove from Favorites</button>
            `;

            // Add click listener for modal opening
            vehicleCard.addEventListener("click", () => openModal(vehicle));

            container.appendChild(vehicleCard);
        }

        // Open the modal and populate it with vehicle data
        function openModal(vehicle) {
            const modal = document.getElementById("vehicle-modal");
            const modalTitle = document.getElementById("modal-title");
            const modalImage = document.getElementById("modal-image");
            const modalSpecs = document.getElementById("modal-specs");

            modalTitle.textContent = `${vehicle.make} ${vehicle.model} (${vehicle.yearofmanufacture})`;
            modalImage.src = vehicle.image_url || '/public/images/placeholder.jpeg';
            modalSpecs.innerHTML = `
                <li><strong>Price:</strong> $${vehicle.price}</li>
                <li><strong>Mileage:</strong> ${vehicle.mileage || "N/A"} miles</li>
                <li><strong>Condition:</strong> ${vehicle.condition || "N/A"}</li>
                <li><strong>Status:</strong> ${vehicle.status || "N/A"}</li>
                <li><strong>Body Type:</strong> ${vehicle.bodytype || "N/A"}</li>
                <li><strong>Drive Train:</strong> ${vehicle.drivetrain || "N/A"}</li>
                <li><strong>Exterior Color:</strong> ${vehicle.exteriorcolor || "N/A"}</li>
                <li><strong>Interior Color:</strong> ${vehicle.interiorcolor || "N/A"}</li>
                <li><strong>Engine Type:</strong> ${vehicle.enginetype || "N/A"}</li>
                <li><strong>Number of Seats:</strong> ${vehicle.numberofseats || "N/A"}</li>
                <li><strong>Transmission:</strong> ${vehicle.transmission || "N/A"}</li>
                <li><strong>Fuel Type:</strong> ${vehicle.fueltype || "N/A"}</li>
            `;

            modal.style.display = "block";
        }

        // Remove a vehicle from favorites
        async function removeFromFavorites(vin) {
            try {
                const response = await fetch("/remove-from-favorites", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ vin }),
                });

                if (!response.ok) {
                    throw new Error(await response.text());
                }

                alert("Vehicle removed from favorites!");
                fetchFavorites();
            } catch (error) {
                console.error("Error removing vehicle:", error);
                alert("Failed to remove vehicle from favorites.");
            }
        }

        document.querySelector(".close-modal").addEventListener("click", () => {
            document.getElementById("vehicle-modal").style.display = "none";
        });

        window.addEventListener("click", (e) => {
            if (e.target === document.getElementById("vehicle-modal")) {
                document.getElementById("vehicle-modal").style.display = "none";
            }
        });

        // Load favorites when the page loads
        document.addEventListener("DOMContentLoaded", fetchFavorites);
    </script>
</body>

</html>
